# rc.conf —— 铺进镜像 rootfs/etc/rc.conf，PolluxOS 开机即上桌面。
# 由 scripts/mkimage.sh 从 overlay/ 拷入。
#
# 思路: kernel → init → 合成器(wayland) → stardesk(dui 画的任务栏/启动器)
# 合成器二选一: weston(简单) 或 sway/wlroots(桌面感强)，按 ports 包管理安装。
# 等包管理方案确定后取消对应注释。

hostname="polluxos"
sshd_enable="NO"                 # 开发期如需 ssh 调试改 YES

# --- Wayland 会话栈 ------------------------------------------------------
# 1) seatd(如合成器需要) — pkg install seatd
#seatd_enable="YES"

# 2) 合成器: 以下示例以日志方式手动拉起，正式要做成 startx 式会话。
#    stardesk 之前会先要求合成器在运行(dui 的 Wayland 后端连的是 wayland socket)。
#    示例(weston):
#    weston_enable="NO"
#    服务调起方式按所选合成器文档写，最终目标:
#    /usr/local/bin/stardesk    # dui shell, 连 $WAYLAND_DISPLAY

# --- 内核模块(必要时) ----------------------------------------------------
#kern_loader="kldload i915kms"    # 真机 Intel GPU 时按需启用
#kern_loader="kldload amdgpu"     # 真机 AMD GPU 时按需启用
