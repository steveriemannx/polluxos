# rc.conf —— 铺进镜像 rootfs/etc/rc.conf，PolluxOS 开机即上桌面。
# 由 scripts/mkimage.sh 从 overlay/ 拷入。
#
# 思路: kernel → init → 合成器(wayland) → polluxdesk(dui 画的任务栏/启动器)
# 合成器二选一: weston(简单) 或 sway/wlroots(桌面感强)，按 ports 包管理安装。
# 等包管理方案确定后取消对应注释。

hostname="polluxos"
sshd_enable="NO"                 # 开发期如需 ssh 调试改 YES

# --- Wi-Fi ---------------------------------------------------------------
# /etc/rc.d/pollux_wifi(overlay 预置)在 netif 之前把第一块无线网卡建成
# wlan0；下面这行让 netif 用 /etc/wpa_supplicant.conf(同样预置了
# ctrl_interface)拉起 wpa_supplicant 并跑 DHCP —— 桌面 Wi-Fi 窗口开机即可
# 切换网络，不需要再跑 enable-control-interface.sh。
pollux_wifi_enable="YES"
ifconfig_wlan0="WPA SYNCDHCP"

# --- Wayland 会话栈 ------------------------------------------------------
# wlroots 需要 seatd 获取 DRM/输入设备。用户需属于 video 组。
seatd_enable="YES"

# 2) 合成器: 以下示例以日志方式手动拉起，正式要做成 startx 式会话。
#    polluxdesk 之前会先要求合成器在运行(dui 的 Wayland 后端连的是 wayland socket)。
#    示例(weston):
#    weston_enable="NO"
#    服务调起方式按所选合成器文档写，最终目标:
#    /usr/local/bin/polluxdesk    # dui shell, 连 $WAYLAND_DISPLAY

# --- DRM/KMS 显卡 ---------------------------------------------------------
# 在 rootfs 挂载后加载显卡模块，避免依赖 loader 的早期模块预加载。
# Ryzen 2600 没有核显；GTX 1060 (Pascal) 必须使用支持 Pascal 的 NVIDIA
# 580 legacy 驱动及匹配的 nvidia-drm-kmod，不能使用 595 分支。
# 没有对应显卡的模块不会绑定设备；有 AMD 核显的笔记本仍可用 amdgpu。
kld_list="amdgpu nvidia-modeset nvidia-drm"
