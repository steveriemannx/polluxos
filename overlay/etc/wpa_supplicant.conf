# wpa_supplicant 的配置，由 rc.conf 里的 ifconfig_wlan0="... WPA ..." 使用。
#
# 下面两行是桌面 Wi-Fi 窗口能工作的前提：wpa_supplicant 以 root 拥有无线电，
# 改配置的唯一免密途径是让它开一个控制 socket，wpa_cli（以及调用它的 Wi-Fi 窗口）
# 通过这个 socket 请求；能不能用是 socket 的文件权限问题，不是特权问题。
# 不写这两行，窗口就只能是只读的（能看不能改）—— FreeBSD 从 rc.conf 拉起
# wpa_supplicant 时不会自己加控制接口，也没有命令行开关能补：-C 只在没给 -c 时
# 才生效，而 rc 脚本总是给 -c。
#
# 注意：这个文件会覆盖镜像里同名的旧文件。网络本身由 Wi-Fi 窗口用
# wpa_cli save_config 写回这里。
ctrl_interface=/var/run/wpa_supplicant
ctrl_interface_group=wheel
