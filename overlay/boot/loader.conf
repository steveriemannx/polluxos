# loader.conf —— 铺进镜像 rootfs/boot/loader.conf，管开机第一屏的品牌。
# 由 scripts/mkimage.sh 从 overlay/ 拷入。
#
# 这里只放覆盖项: loader 先读 /boot/defaults/loader.conf，再读本文件，
# 所以本文件不需要复制任何默认值，也就故意只有下面这几行。
#
# 图形本体在 /boot/lua/logo-polluxos.lua、brand-polluxos.lua(彩色)和
# brand-polluxosbw.lua(控制台不支持彩色时 loader 自动选的 bw 版)；
# /boot/{logo,brand}-polluxos*.4th 是同样内容给不带 Lua 的 loader 用的孪生版。
# 改图形就改那 6 个文件，键名不用动。

loader_logo="polluxos"
loader_brand="polluxos"
loader_menu_frame="none"
loader_menu_title="Welcome to PolluxOS"
loader_menu_title_align="left"

# NVIDIA DRM KMS 必须在 nvidia-drm 模块加载前启用；无 NVIDIA GPU 时无影响。
hw.nvidiadrm.modeset="1"
